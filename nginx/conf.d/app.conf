server {
    listen 80;
    server_name airbnbclone.com www.airbnbclone.com;

    # HTTP → HTTPS 강제 리다이렉트
    return 301 https://www.airbnbclone.com;
}

server {
    listen 443 ssl;
    server_name airbnbclone.com www.airbnbclone.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Next.js 프런트엔드 프록시
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $122.202.45.102;
        proxy_set_header X-Real-IP $122.202.45.102;
    }

    # NestJS 백엔드 프록시
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_set_header Host $122.202.45.102;
        proxy_set_header X-Real-IP $122.202.45.102;
    }

    # WebSocket (필요한 경우)
    location /ws/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
