services:
  # POSTGRES
  db:
    image: postgres:16-alpine
    container_name: airbnb_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-airbnb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airbnb}
      POSTGRES_DB: ${DB_DATABASE:-airbnb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airbnb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OLLAMA
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11500:11434"
    volumes:
      - ./ollama_models:/root/.ollama
    networks:
      - airbnb_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 5s
      retries: 20

  # BACKEND (NESTJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=airbnb-bot
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - airbnb_network
    command: npm run start:dev

  # FRONTEND (NEXT.JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airbnb_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - airbnb_network
    command: npm run dev

  # NGINX
  nginx:
    image: nginx:latest
    container_name: airbnb-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - airbnb_network
    restart: always

volumes:
  postgres_data:
  ollama_data:

networks:
  airbnb_network:
    driver: bridge
