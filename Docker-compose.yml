services:
  # POSTGRES
  db:
    image: postgres:16-alpine
    container_name: airbnb_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-airbnb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airbnb}
      POSTGRES_DB: ${DB_DATABASE:-airbnb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airbnb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OLLAMA (healthcheck 제거)
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./ollama_models:/root/.ollama
    ports:
      - "11500:11434"
    networks:
      - airbnb_network
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # BACKEND (NESTJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - DB_HOST=airbnb_db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=airbnb-bot
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started  # ⚡ healthy → started로 변경
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - airbnb_network
    command: npm run start:dev

  # FRONTEND (NEXT.JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airbnb_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - airbnb_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  airbnb_network:
    driver: bridge